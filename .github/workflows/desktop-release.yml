name: "Release v1.1.0: The Melodies of Gallorin"
run-name: "Release v1.1.0: The Melodies of Gallorin"
on:
  push:
    tags: ['gallorin-v*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Verify release version
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne "gallorin-v$version") { throw "Tag must match package.json version." }
      - name: Verify changelog and version consistency
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') { node scripts/release-notes.js --check --release }
          else { node scripts/release-notes.js --check }
          if ($LASTEXITCODE -ne 0) { throw "Changelog/version validation failed." }
      - run: npm test
      - name: Build Windows installer without publishing
        run: npx electron-builder --config electron-builder.json --win --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Smoke test packaged app with isolated data
        shell: pwsh
        run: |
          $env:AETHERION_TEST_DATA = Join-Path $env:RUNNER_TEMP ("aetherion-smoke-" + [Guid]::NewGuid())
          $env:AETHERION_SOFTWARE_RENDERING = '1'
          $env:ELECTRON_ENABLE_LOGGING = '1'
          New-Item -ItemType Directory -Force -Path $env:AETHERION_TEST_DATA | Out-Null
          "AETHERION_TEST_DATA=$env:AETHERION_TEST_DATA" >> $env:GITHUB_ENV
          $stdout = Join-Path $env:AETHERION_TEST_DATA 'smoke-stdout.log'
          $stderr = Join-Path $env:AETHERION_TEST_DATA 'smoke-stderr.log'
          $process = Start-Process -FilePath './dist/win-unpacked/Gallorin.exe' -ArgumentList '--smoke-test' -PassThru -WindowStyle Hidden -RedirectStandardOutput $stdout -RedirectStandardError $stderr
          $null = $process.Handle
          $timedOut = -not $process.WaitForExit(180000)
          if ($timedOut) { $process.Kill() }
          # Print the app's own output and desktop.log so failures name the failing check.
          foreach ($file in @($stdout, $stderr, (Join-Path $env:AETHERION_TEST_DATA 'browser/desktop.log'))) {
            if (Test-Path $file) { Write-Host "::group::$(Split-Path $file -Leaf)"; Get-Content $file | Write-Host; Write-Host '::endgroup::' }
          }
          if ($timedOut) { throw "Desktop smoke test timed out." }
          if ($process.ExitCode -ne 0 -or -not (Test-Path (Join-Path $env:AETHERION_TEST_DATA 'desktop-smoke.json'))) { throw "Desktop smoke test failed (exit code $($process.ExitCode))." }
      - name: Upload smoke test diagnostics
        if: failure() && env.AETHERION_TEST_DATA != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Gallorin-smoke-diagnostics
          path: |
            ${{ env.AETHERION_TEST_DATA }}/*.png
            ${{ env.AETHERION_TEST_DATA }}/*.log
            ${{ env.AETHERION_TEST_DATA }}/*.json
            ${{ env.AETHERION_TEST_DATA }}/browser/desktop.log
          retention-days: 14
          if-no-files-found: warn
      - name: Publish validated release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $releaseTitle = node scripts/release-notes.js --title
          if ($LASTEXITCODE -ne 0) { throw "Could not read release title." }
          node scripts/release-notes.js --write
          if ($LASTEXITCODE -ne 0) { throw "Could not generate release notes." }
          gh release create $tag --draft --title $releaseTitle --notes-file dist/release-notes.md
          if ($LASTEXITCODE -ne 0) { throw "Release creation failed." }
          $assets = @(Get-ChildItem dist/*.exe,dist/*.blockmap,dist/latest.yml | ForEach-Object FullName)
          gh release upload $tag @assets
          if ($LASTEXITCODE -ne 0) { throw "Upload failed; release remains draft." }
          gh release edit $tag --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw "Publication failed." }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Gallorin-Windows
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
            dist/release-notes.md

