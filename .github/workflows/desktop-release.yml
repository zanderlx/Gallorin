name: "Release v1.1.1: The Melodies of Gallorin"
run-name: "Release v1.1.1: The Melodies of Gallorin"
on:
  push:
    tags: ['gallorin-v*']
permissions:
  contents: read
concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    uses: ./.github/workflows/windows-validation.yml
    with:
      release: true
  publish:
    name: Approve and publish validated release
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Gallorin-Windows
          path: dist
      - name: Recheck downloaded assets
        run: node scripts/verify-release-assets.js
      - name: Publish approved release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $releaseTitle = node scripts/release-notes.js --title
          if ($LASTEXITCODE -ne 0) { throw 'Could not read release title.' }
          node scripts/release-notes.js --write
          if ($LASTEXITCODE -ne 0) { throw 'Could not generate release notes.' }
          gh release create $tag --verify-tag --draft --title $releaseTitle --notes-file dist/release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed.' }
          $assets = @(Get-ChildItem dist/*.exe,dist/*.blockmap,dist/latest.yml | ForEach-Object FullName)
          gh release upload $tag @assets
          if ($LASTEXITCODE -ne 0) { throw 'Upload failed; release remains draft.' }
          gh release edit $tag --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Publication failed.' }
