name: Windows validation
on:
  workflow_call:
    inputs:
      release:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  windows:
    name: Windows packaged validation
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Verify version and changelog
        shell: pwsh
        env:
          RELEASE_BUILD: ${{ inputs.release }}
        run: |
          if ($env:RELEASE_BUILD -eq 'true') {
            $version = (Get-Content package.json | ConvertFrom-Json).version
            if ($env:GITHUB_REF_TYPE -ne 'tag' -or $env:GITHUB_REF_NAME -ne "gallorin-v$version") { throw 'Release tag must match package version.' }
            git merge-base --is-ancestor HEAD origin/main
            if ($LASTEXITCODE -ne 0) { throw 'Release commit must be merged into main.' }
            node scripts/release-notes.js --check --release
          } else { node scripts/release-notes.js --check }
          if ($LASTEXITCODE -ne 0) { throw 'Version/changelog validation failed.' }
      - run: npm test
      - name: Build without publishing
        run: npm run desktop:build
      - name: Verify installer and updater metadata
        run: node scripts/verify-release-assets.js
      - name: Packaged smoke tests (normal and reduced motion)
        shell: pwsh
        run: ./scripts/desktop-smoke.ps1
      - name: Upload smoke diagnostics
        if: always() && env.SMOKE_DIAGNOSTICS != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Gallorin-smoke-diagnostics
          path: |
            ${{ env.SMOKE_DIAGNOSTICS }}/**/*.png
            ${{ env.SMOKE_DIAGNOSTICS }}/**/*.log
            ${{ env.SMOKE_DIAGNOSTICS }}/**/desktop-smoke.json
          retention-days: 14
          if-no-files-found: error
      - name: Upload validated installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Gallorin-Windows
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          if-no-files-found: error
          retention-days: 14
