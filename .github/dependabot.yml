# Weekly update PRs. Nothing auto-merges: review and test each one, especially Electron.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
    groups:
      electron:
        patterns: ['electron', 'electron-builder', 'electron-updater']
      dev-tooling:
        dependency-type: development
        exclude-patterns: ['electron', 'electron-builder']
    ignore:
      # Keep Node type definitions on the Node major that Electron bundles (see .node-version).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
    groups:
      actions:
        patterns: ['*']
