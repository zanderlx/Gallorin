<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; media-src 'self'"
    />
    <title>Gallorin</title>
    <link rel="stylesheet" href="menu.css" />
    <link rel="stylesheet" href="../public/audio-settings.css" />
    <link rel="stylesheet" href="../public/changelog.css" />
  </head>
  <body>
    <div class="landscape" aria-hidden="true">
      <div class="moon"></div>
      <div class="ridge back"></div>
      <div class="ridge front"></div>
    </div>
    <main>
      <div class="ornament">✧ &nbsp; ✦ &nbsp; ✧</div>
      <img src="assets/logo.svg" alt="" width="108" height="108" />
      <h1>GALLORIN</h1>
      <p class="subtitle">A HORSEKEEPER’S CHRONICLE</p>
      <nav aria-label="Main menu">
        <button id="play" class="primary">Play</button><button id="settings">Settings</button
        ><button id="exit">Exit Game</button>
      </nav>
    </main>
    <footer>
      <div class="menu-version-links">
        <span id="version"></span><span aria-hidden="true">|</span
        ><button id="open-changelog" type="button" aria-haspopup="dialog">Changelog</button>
      </div>
      <button id="mute" aria-label="Mute music" title="Mute music">♫ Music On</button>
    </footer>

    <audio id="music" src="assets/music/main-menu.mp3" loop></audio>
    <script type="module" src="menu.js"></script>
  </body>
</html>
